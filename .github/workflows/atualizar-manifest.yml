name: Atualizar manifest.json

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da Release a usar (ex: v1.0.0) — só é usada quando você roda manualmente'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  gerar-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Gerar manifest.json a partir dos arquivos do Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}

        run: |
          echo "Usando a Release: $RELEASE_TAG"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          gh release view "$RELEASE_TAG" --json assets \
            --jq '{
              version: "'"$RELEASE_TAG"'",
              mods: [
                .assets[]
                | select(.name | endswith(".jar"))
                | {
                    arquivo: .name,
                    url: .url
                  }
              ],
              resourcepacks: [
                .assets[]
                | select(.name | endswith(".zip"))
                | {
                    arquivo: .name,
                    url: .url
                  }
              ],
              configs: [
                .assets[]
                | select(.name == "cobblemaster.json")
                | {
                    arquivo: .name,
                    url: .url
                  }
              ]
            }' > manifest.json

          echo "Conteúdo gerado:"
          cat manifest.json

      - name: Salvar o manifest.json atualizado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add manifest.json

          git diff --cached --quiet || git commit \
            -m "Atualizar manifest.json (Release: $RELEASE_TAG)"

          git push
